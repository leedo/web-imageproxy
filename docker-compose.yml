# Example wiring for the deploy target: the translator plus a private imagor.
services:
  imageproxy:
    build: .
    ports:
      - "5007:5007"
    environment:
      IMAGOR_URL: http://imagor:8000
      IMAGOR_SECRET: ${IMAGOR_SECRET:?set IMAGOR_SECRET}
    depends_on:
      - imagor

  imagor:
    image: shumc/imagor:1.9.14
    restart: unless-stopped
    # imagor buffers whole origin bodies in memory, including chunked ones the
    # size cap can't see; bound it so a hostile origin can't exhaust the host
    mem_limit: 1g
    environment:
      IMAGOR_SECRET: ${IMAGOR_SECRET:?set IMAGOR_SECRET}
      HTTP_LOADER_MAX_ALLOWED_SIZE: "10485760"
      HTTP_LOADER_BLOCK_LOOPBACK_NETWORKS: "1"
      HTTP_LOADER_BLOCK_PRIVATE_NETWORKS: "1"
      HTTP_LOADER_BLOCK_LINK_LOCAL_NETWORKS: "1"
      HTTP_LOADER_OVERRIDE_RESPONSE_HEADERS: ETag,Last-Modified
      # the translator sends the old Firefox User-Agent; pass it to origins
      HTTP_LOADER_FORWARD_HEADERS: User-Agent
      IMAGOR_REQUEST_TIMEOUT: 60s
      IMAGOR_PROCESS_CONCURRENCY: "4"
      IMAGOR_PROCESS_QUEUE_SIZE: "50"
      VIPS_CONCURRENCY: "1"
      VIPS_MAX_RESOLUTION: "50000000"
